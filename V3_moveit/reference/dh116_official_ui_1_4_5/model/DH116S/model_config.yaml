  # 胶皮波纹管：CPU 顶点形变。
  #   顶点分区(蓝固定/绿形变/红锚点)、权重、形变控制参数全部来自 segmentation JSON。
  #   红锚点区刚性跟随大拇指 finger12(含旋转)，绿区按权重弯曲+泊松收缩，蓝区固定。
  #   几何也从 JSON 读取(绕过 assimp)以保证顶点索引与分割数据对齐。
  #   follow_offset_pos：只平移开口(红区)此向量对准手指；绿区被拉伸跟随，蓝区不动(米)。
  #   follow_offset_euler：手指 0° 时把胶皮绕 pivot 旋转此角度对齐手指(欧拉角,度,ZYX)。
  #   必须放在列表末尾，避免打乱前面关节→模型索引的位置映射。
  - file: /model/DH116S/rubber_link.STL
    name: rubber_link
    parent_link: base_link
    position: [0, 0, 0]
    rotation: [0, 0, 0]
    scale: 1
    color: "#2A2A2A"
    type: rubber
    fixed_link: base_link
    follow_link: finger12_link
    segmentation: /model/DH116S/segmented_mesh_result.json
    follow_offset_pos: [0.01, 0.022, -0.011]
    follow_offset_euler: [0, 0, 0]