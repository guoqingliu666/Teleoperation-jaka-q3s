move_group_name: arm
publish_period: 0.008
max_expected_latency: 0.032
incoming_command_timeout: 0.08
command_in_type: speed_units
pose_command_in_topic: /v3/pose_target
cartesian_command_in_topic: /v3/twist_target
joint_command_in_topic: /v3/joint_jog
joint_topic: /joint_states
command_out_topic: /v3/servo_trajectory
command_out_type: trajectory_msgs/JointTrajectory
publish_joint_positions: true
publish_joint_velocities: true
publish_joint_accelerations: true
status_topic: /v3/servo_status
monitored_planning_scene_topic: /monitored_planning_scene
is_primary_planning_scene_monitor: false
check_collisions: true
collision_check_rate: 50.0
self_collision_proximity_threshold: 0.02
scene_collision_proximity_threshold: 0.05
lower_singularity_threshold: 17.0
hard_stop_singularity_threshold: 30.0
leaving_singularity_threshold_multiplier: 2.0
joint_limit_margins: [0.034906585]
# The fixed-grid adapter owns native Ruckig and checks every return code.
# MoveIt Servo still supplies IK, limits, singularity and collision handling.
use_smoothing: false
smoothing_filter_plugin_name: online_signal_smoothing::RuckigFilterPlugin
scale:
  linear: 0.1
  rotational: 0.4
  joint: 0.174532925
pose_tracking:
  linear_tolerance: 0.001
  angular_tolerance: 0.002
